server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: evita que nginx falle al arrancar si un servicio aún no existe
    resolver 127.0.0.11 valid=10s;

    # Microservicio de IA
    location /api/ia/ {
        set $ai_upstream http://aiservice:8080;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservicio de integración con Moodle (conexión y extracción, RF-02 / RF-03)
    location /api/moodle/ {
        set $moodle_upstream http://moodleservice:8080;
        proxy_pass $moodle_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API principal (autenticación, cursos, sincronización...)
    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta del frontend devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
