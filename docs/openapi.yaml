openapi: 3.0.3
info:
  title: EduMonitor AI - REST API
  description: API del sistema inteligente de seguimiento y análisis del rendimiento académico (UTA).
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Servidor de desarrollo local

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CursoId:
      name: cursoId
      in: path
      required: true
      description: Identificador del curso (debe pertenecer al docente autenticado).
      schema:
        type: integer
    ActividadId:
      name: id
      in: path
      required: true
      description: Identificador de la actividad.
      schema:
        type: integer
    ActividadIdPath:
      name: actividadId
      in: path
      required: true
      description: Identificador de la actividad.
      schema:
        type: integer
    DocenteIdPath:
      name: id
      in: path
      required: true
      description: Identificador de la cuenta del docente.
      schema:
        type: integer

  schemas:
    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          example: docente@edumonitor.local
        password:
          type: string
          format: password
          example: Docente.UTA-2026

    UsuarioDto:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          enum: [Docente, AdministradorTecnico]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/UsuarioDto'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    # --- RF-03: sincronización con Moodle ---
    SincronizarMoodleRequest:
      type: object
      properties:
        cursosMoodle:
          type: array
          nullable: true
          description: Ids de cursos de Moodle a sincronizar; vacío o null = todos los visibles para el usuario técnico.
          items:
            type: integer
            format: int64

    DetalleSincronizacionDto:
      type: object
      properties:
        tipo:
          type: string
          enum: [error, advertencia, info]
        cursoMoodleId:
          type: integer
          format: int64
          nullable: true
        mensaje:
          type: string

    SincronizacionMoodleDto:
      type: object
      properties:
        id:
          type: integer
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum: [en_curso, exitosa, con_advertencias, fallida]
        usuarioCorreo:
          type: string
          nullable: true
          description: Administrador que la ejecutó; null si fue una sincronización automática.
        urlMoodle:
          type: string
          nullable: true
        cursosImportados:
          type: integer
        cursosOmitidos:
          type: integer
        estudiantesImportados:
          type: integer
        matriculasActivas:
          type: integer
        matriculasRetiradas:
          type: integer
        actividadesImportadas:
          type: integer
        calificacionesImportadas:
          type: integer
        mensaje:
          type: string
          nullable: true
        detalle:
          type: array
          items:
            $ref: '#/components/schemas/DetalleSincronizacionDto'

    EstadoSincronizacionDto:
      type: object
      description: Fuente y fecha de los datos que ve el docente (RNF-08).
      properties:
        ultimaSincronizacion:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          nullable: true
        urlMoodle:
          type: string
          nullable: true
        cursosMoodle:
          type: integer
        sincronizacionAutomatica:
          type: boolean
        intervaloMinutos:
          type: integer
          nullable: true

    # --- HU-02: cuentas de docentes (solo Administrador Técnico) ---
    DocenteDto:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        correo:
          type: string
          description: Debe coincidir con el correo del profesor en Moodle; la sincronización asigna los cursos por este correo.
        activo:
          type: boolean
        bloqueado:
          type: boolean
          description: Bloqueado temporalmente por intentos fallidos de inicio de sesión.
        bloqueadoHasta:
          type: string
          format: date-time
          nullable: true
        ultimoAcceso:
          type: string
          format: date-time
          nullable: true
        cursosAsignados:
          type: integer
          description: Cursos de Moodle asignados en la sincronización (0 suele indicar que el correo no coincide).
        fechaCreacion:
          type: string
          format: date-time

    CrearDocenteRequest:
      type: object
      required: [nombre, correo, claveTemporal]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
          example: María Fernanda López
        correo:
          type: string
          format: email
          example: mlopez@uta.edu.ec
        claveTemporal:
          type: string
          minLength: 8
          maxLength: 128
          description: Mínimo 8 caracteres, con letras y números.

    EditarDocenteRequest:
      type: object
      required: [nombre, correo]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 150
        correo:
          type: string
          format: email

    CambiarEstadoDocenteRequest:
      type: object
      required: [activo]
      properties:
        activo:
          type: boolean

    RestablecerClaveRequest:
      type: object
      required: [claveTemporal]
      properties:
        claveTemporal:
          type: string
          minLength: 8
          maxLength: 128

    CursoDto:
      type: object
      properties:
        id:
          type: integer
        docenteId:
          type: integer
        docenteNombre:
          type: string
        nombre:
          type: string
        codigo:
          type: string
        periodo:
          type: string
        escalaCalificacion:
          type: number
        paralelo:
          type: string
        totalEstudiantes:
          type: integer
        fechaCreacion:
          type: string
          format: date-time
        origen:
          type: string
          enum: [local, moodle]
        fechaSincronizacion:
          type: string
          format: date-time
          nullable: true
        moodleCourseId:
          type: integer
          format: int64
          nullable: true
        urlMoodle:
          type: string
          nullable: true
          description: Página del curso en Moodle (null si el curso no proviene de Moodle).
          example: http://localhost:8081/course/view.php?id=2

    MatriculaDto:
      type: object
      properties:
        id:
          type: integer
        cursoId:
          type: integer
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        correo:
          type: string
        fechaMatricula:
          type: string
          format: date-time
        estado:
          type: string
          example: Activa

    # --- Sprint 2: actividades y calificaciones (solo lectura; se crean y califican en Moodle) ---
    ActividadDto:
      type: object
      properties:
        id:
          type: integer
        cursoId:
          type: integer
        nombre:
          type: string
        tipo:
          type: string
        componente:
          type: string
          enum: [contacto_docente, practico_experimental, autonomo]
        componenteEtiqueta:
          type: string
        componenteEtiquetaCorta:
          type: string
        parcial:
          type: integer
          enum: [1, 2]
        fechaEntrega:
          type: string
          format: date-time
          nullable: true
        puntajeMaximo:
          type: number
        totalCalificados:
          type: integer
        totalEstudiantes:
          type: integer
        vencida:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        moodleGradeItemId:
          type: integer
          format: int64
          nullable: true
          description: Ítem de calificación de Moodle del que proviene la actividad.
        urlMoodle:
          type: string
          nullable: true
          description: Vista de calificación del ítem en Moodle (grade/report/singleview), donde el docente califica.
          example: http://localhost:8081/grade/report/singleview/index.php?id=2&item=grade&itemid=15


    CalificacionActividadDto:
      type: object
      properties:
        actividadId:
          type: integer
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        correo:
          type: string
        nota:
          type: number
          nullable: true
        puntajeMaximo:
          type: number
        estado:
          type: string
          enum: [calificada, nota_cero, sin_entrega, pendiente, completada]
        estadoEtiqueta:
          type: string
        observacion:
          type: string
          nullable: true
        fechaActualizacion:
          type: string
          format: date-time
          nullable: true

    FinalizacionEstudianteDto:
      type: object
      properties:
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        totalActividades:
          type: integer
        completadas:
          type: integer
        vencidas:
          type: integer
        sinEntrega:
          type: integer
        pendientes:
          type: integer
        porcentajeFinalizacion:
          type: number
          nullable: true

    FinalizacionCursoDto:
      type: object
      properties:
        cursoId:
          type: integer
        cursoNombre:
          type: string
        fechaCalculo:
          type: string
          format: date-time
        estudiantes:
          type: array
          items:
            $ref: '#/components/schemas/FinalizacionEstudianteDto'

    # --- Sprint 2: indicadores, ficha y análisis ---
    DistribucionNotaDto:
      type: object
      properties:
        rango:
          type: string
          example: 80-89
        etiqueta:
          type: string
        cantidad:
          type: integer
        porcentaje:
          type: number

    ProgresoCursoDto:
      type: object
      properties:
        totalEsperado:
          type: integer
        completadas:
          type: integer
        calificadas:
          type: integer
        notaCero:
          type: integer
        sinEntrega:
          type: integer
        pendientes:
          type: integer
        actividadesVencidas:
          type: integer
        porcentajeAvance:
          type: number
          nullable: true
        porcentajeFinalizacionVencidas:
          type: number
          nullable: true

    ResumenComponenteDto:
      type: object
      properties:
        componente:
          type: string
        etiqueta:
          type: string
        etiquetaCorta:
          type: string
        parcial:
          type: integer
        ponderacion:
          type: number
        actividades:
          type: integer
        calificadas:
          type: integer
        promedioSobre10:
          type: number
          nullable: true

    ResumenParcialDto:
      type: object
      properties:
        parcial:
          type: integer
        promedioSobre10:
          type: number
          nullable: true
        estudiantesConNota:
          type: integer
        estudiantesIncompletos:
          type: integer
        completo:
          type: boolean

    EstudianteResumenDto:
      type: object
      properties:
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        correo:
          type: string
        promedioActividades:
          type: number
          nullable: true
        notaParcial1:
          type: number
          nullable: true
        notaParcial2:
          type: number
          nullable: true
        notaFinal:
          type: number
          nullable: true
        calificadas:
          type: integer
        notaCero:
          type: integer
        sinEntrega:
          type: integer
        pendientes:
          type: integer
        completadasSinNota:
          type: integer
        porcentajeFinalizacion:
          type: number
          nullable: true
        alertas:
          type: integer

    DashboardCursoDto:
      type: object
      properties:
        cursoId:
          type: integer
        cursoNombre:
          type: string
        cursoCodigo:
          type: string
        periodo:
          type: string
        escalaCalificacion:
          type: number
          description: Escala de la nota final del curso (por defecto 20).
        escalaNotaFinal:
          type: number
        fechaCalculo:
          type: string
          format: date-time
        totalMatriculados:
          type: integer
        actividadesTotales:
          type: integer
        actividadesEvaluadas:
          type: integer
        estudiantesConNota:
          type: integer
        promedioCurso:
          type: number
          nullable: true
          description: Promedio ponderado normalizado a la escala del curso.
        desviacionEstandar:
          type: number
          nullable: true
        aprobadosProyectados:
          type: integer
        estudiantesEnRiesgo:
          type: integer
        distribucion:
          type: array
          items:
            $ref: '#/components/schemas/DistribucionNotaDto'
        progreso:
          $ref: '#/components/schemas/ProgresoCursoDto'
        componentes:
          type: array
          items:
            $ref: '#/components/schemas/ResumenComponenteDto'
        parciales:
          type: array
          items:
            $ref: '#/components/schemas/ResumenParcialDto'
        estudiantes:
          type: array
          items:
            $ref: '#/components/schemas/EstudianteResumenDto'
        advertencias:
          type: array
          items:
            type: string

    ActividadEstudianteDto:
      type: object
      properties:
        actividadId:
          type: integer
        nombre:
          type: string
        tipo:
          type: string
        componente:
          type: string
        componenteEtiqueta:
          type: string
        componenteEtiquetaCorta:
          type: string
        parcial:
          type: integer
        fechaEntrega:
          type: string
          format: date-time
          nullable: true
        puntajeMaximo:
          type: number
        nota:
          type: number
          nullable: true
        porcentaje:
          type: number
          nullable: true
        estado:
          type: string
          enum: [calificada, nota_cero, sin_entrega, pendiente, completada]
        estadoEtiqueta:
          type: string
        observacion:
          type: string
          nullable: true
        vencida:
          type: boolean

    EvolucionNotaDto:
      type: object
      properties:
        actividadId:
          type: integer
        etiqueta:
          type: string
        fecha:
          type: string
          format: date-time
          nullable: true
        nota:
          type: number
          nullable: true
        notaSobre10:
          type: number
          nullable: true
        estado:
          type: string

    ComponenteEstudianteDto:
      type: object
      properties:
        componente:
          type: string
        etiqueta:
          type: string
        etiquetaCorta:
          type: string
        parcial:
          type: integer
        ponderacion:
          type: number
        actividadesCalificadas:
          type: integer
        promedioSobre10:
          type: number
          nullable: true
        tieneDatos:
          type: boolean

    FichaEstudianteDto:
      type: object
      properties:
        cursoId:
          type: integer
        cursoNombre:
          type: string
        cursoCodigo:
          type: string
        periodo:
          type: string
        escalaCalificacion:
          type: number
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        correo:
          type: string
        promedioActividades:
          type: number
          nullable: true
        notaParcial1:
          type: number
          nullable: true
        notaParcial2:
          type: number
          nullable: true
        notaFinal:
          type: number
          nullable: true
        parcial1Completo:
          type: boolean
        parcial2Completo:
          type: boolean
        actividadesTotales:
          type: integer
        calificadas:
          type: integer
        notaCero:
          type: integer
        sinEntrega:
          type: integer
        pendientes:
          type: integer
        completadas:
          type: integer
        porcentajeFinalizacion:
          type: number
          nullable: true
        componentes:
          type: array
          items:
            $ref: '#/components/schemas/ComponenteEstudianteDto'
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadEstudianteDto'
        evolucion:
          type: array
          items:
            $ref: '#/components/schemas/EvolucionNotaDto'
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/AlertaDto'

    ActividadAnalisisDto:
      type: object
      properties:
        actividadId:
          type: integer
        nombre:
          type: string
        componente:
          type: string
        componenteEtiquetaCorta:
          type: string
        parcial:
          type: integer
        fechaEntrega:
          type: string
          format: date-time
          nullable: true
        puntajeMaximo:
          type: number
        estudiantes:
          type: integer
        calificados:
          type: integer
        promedioNota:
          type: number
          nullable: true
        promedioPorcentaje:
          type: number
          nullable: true
        porcentajeFinalizacion:
          type: number
          nullable: true
        resultadoBajo:
          type: boolean

    TendenciaAnalisisDto:
      type: object
      properties:
        actividadId:
          type: integer
        etiqueta:
          type: string
        fecha:
          type: string
          format: date-time
          nullable: true
        promedioPorcentaje:
          type: number
          nullable: true
        tendencia:
          type: string
          nullable: true
          enum: [mejora, descenso, estable]
        variacion:
          type: number
          nullable: true

    AnalisisGrupalDto:
      type: object
      properties:
        cursoId:
          type: integer
        cursoNombre:
          type: string
        cursoCodigo:
          type: string
        periodo:
          type: string
        escalaCalificacion:
          type: number
        fechaCalculo:
          type: string
          format: date-time
        totalEstudiantes:
          type: integer
        actividades:
          type: integer
        actividadesBajas:
          type: integer
        estudiantesEnRiesgo:
          type: integer
        promedioCurso:
          type: number
          nullable: true
        desviacionEstandar:
          type: number
          nullable: true
        tendenciaGeneral:
          type: string
        variacionTendencia:
          type: number
          nullable: true
        detalleActividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadAnalisisDto'
        componentes:
          type: array
          items:
            $ref: '#/components/schemas/ResumenComponenteDto'
        tendencias:
          type: array
          items:
            $ref: '#/components/schemas/TendenciaAnalisisDto'
        hallazgos:
          type: array
          items:
            type: string
        advertencias:
          type: array
          items:
            type: string

    # --- Sprint 2: alertas y reglas ---
    ReglaAlertaDto:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum: [descenso, atraso, baja_finalizacion]
        nombre:
          type: string
        parametrosJson:
          type: string
          description: Parámetros de la regla en formato JSON.
          example: '{"k":3,"delta":1.0}'
        activa:
          type: boolean
        fechaActualizacion:
          type: string
          format: date-time

    EditarReglaAlertaRequest:
      type: object
      required: [activa, parametrosJson]
      properties:
        activa:
          type: boolean
        parametrosJson:
          type: string
          minLength: 2
          maxLength: 400
          description: >-
            JSON válido según el tipo de regla: descenso requiere k y delta;
            atraso requiere n; baja_finalizacion requiere p (1-100).
          example: '{"k":3,"delta":1.0}'

    AlertaDto:
      type: object
      properties:
        tipo:
          type: string
          enum: [descenso, atraso, baja_finalizacion]
        tipoEtiqueta:
          type: string
        regla:
          type: string
        estudianteId:
          type: integer
        identificacion:
          type: string
        nombre:
          type: string
        evidencia:
          type: string
          description: Explicación determinista de por qué se generó la alerta.
        severidad:
          type: string
          enum: [alta, media, baja]
        fechaCalculo:
          type: string
          format: date-time

    ResumenAlertasDto:
      type: object
      properties:
        total:
          type: integer
        descenso:
          type: integer
        atraso:
          type: integer
        bajaFinalizacion:
          type: integer
        estudiantesAfectados:
          type: integer

    AlertasCursoDto:
      type: object
      properties:
        cursoId:
          type: integer
        cursoNombre:
          type: string
        cursoCodigo:
          type: string
        periodo:
          type: string
        escalaCalificacion:
          type: number
        fechaCalculo:
          type: string
          format: date-time
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/AlertaDto'
        resumen:
          $ref: '#/components/schemas/ResumenAlertasDto'
        reglas:
          type: array
          items:
            $ref: '#/components/schemas/ReglaAlertaDto'
        advertencias:
          type: array
          items:
            type: string

paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos incompletos
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de peticiones alcanzado

  /api/auth/me:
    get:
      summary: Obtener usuario autenticado
      tags: [Autenticación]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDto'
        '401':
          description: No autenticado

  /api/cursos:
    get:
      summary: Listar cursos del docente autenticado
      tags: [Cursos]
      security:
        - BearerAuth: []
      parameters:
        - name: periodo
          in: query
          required: false
          description: Filtra por período académico exacto (HU-09).
          schema:
            type: string
            example: Periodo 2026-A
        - name: q
          in: query
          required: false
          description: Busca por nombre, código o paralelo (HU-09).
          schema:
            type: string
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoDto'
        '401':
          description: No autenticado
  /api/cursos/{id}:
    get:
      summary: Obtener detalle de un curso propio
      tags: [Cursos]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del curso
        '403':
          description: Curso ajeno al docente
        '404':
          description: No encontrado
  /api/cursos/{cursoId}/matriculas:
    get:
      summary: Listar estudiantes matriculados en un curso
      tags: [Matrículas]
      security:
        - BearerAuth: []
      parameters:
        - name: cursoId
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Busca por identificación, nombre o correo del estudiante (HU-09).
          schema:
            type: string
        - name: estado
          in: query
          required: false
          description: Estado de matrícula; por defecto Activa. Use Todas para no filtrar.
          schema:
            type: string
            default: Activa
      responses:
        '200':
          description: Lista de estudiantes matriculados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatriculaDto'
  /api/cursos/periodos:
    get:
      summary: Listar períodos académicos disponibles
      description: Devuelve los períodos distintos de los cursos visibles para el usuario autenticado (HU-09).
      tags: [Cursos]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Períodos ordenados de forma descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: Periodo 2026-A

  /api/cursos/{cursoId}/actividades:
    get:
      summary: Listar actividades de un curso autorizado
      tags: [Actividades]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Actividades ordenadas por parcial y fecha de entrega
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActividadDto'
        '401':
          description: No autenticado
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado

  /api/actividades/{id}:
    get:
      summary: Obtener una actividad
      tags: [Actividades]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActividadId'
      responses:
        '200':
          description: Detalle de la actividad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadDto'
        '403':
          description: Actividad de un curso ajeno
        '404':
          description: Actividad no encontrada

  /api/actividades/{actividadId}/calificaciones:
    get:
      summary: Listar calificaciones de una actividad
      description: >-
        Devuelve una fila por estudiante matriculado activamente. Los estudiantes sin
        registro explícito aparecen con el estado efectivo (sin_entrega o pendiente).
      tags: [Calificaciones]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActividadIdPath'
      responses:
        '200':
          description: Calificaciones de la actividad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalificacionActividadDto'
        '403':
          description: Actividad de un curso ajeno
        '404':
          description: Actividad no encontrada

  /api/cursos/{cursoId}/finalizacion:
    get:
      summary: Consultar finalización de actividades por estudiante
      tags: [Actividades]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Resumen de finalización del curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizacionCursoDto'
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado

  /api/indicadores/curso/{cursoId}:
    get:
      summary: Dashboard de indicadores del curso
      description: >-
        Calcula promedio ponderado con escala explícita, desviación estándar,
        distribución por rangos, progreso, resumen por componente y por parcial, y el
        listado de estudiantes con notas proyectadas (HU-07).
      tags: [Indicadores]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Indicadores del curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCursoDto'
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado

  /api/indicadores/curso/{cursoId}/estudiantes/{estudianteId}:
    get:
      summary: Ficha individual de seguimiento del estudiante
      description: >-
        Devuelve notas parciales y final (solo si ambos parciales están completos),
        evolución de notas, estados por actividad y alertas del estudiante (HU-08).
      tags: [Indicadores]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
        - name: estudianteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ficha del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaEstudianteDto'
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado o estudiante no matriculado activamente

  /api/alertas/curso/{cursoId}:
    get:
      summary: Listar alertas académicas del curso
      description: >-
        Genera alertas deterministas de descenso, atraso y baja finalización con
        evidencia verificable y las reglas aplicadas. No emite etiquetas definitivas
        sobre el estudiante (HU-10).
      tags: [Alertas]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Alertas del curso y resumen por tipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertasCursoDto'
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado

  /api/alertas/reglas:
    get:
      summary: Listar reglas de alerta configuradas
      tags: [Alertas]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reglas de alerta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReglaAlertaDto'
        '401':
          description: No autenticado

  /api/alertas/reglas/{id}:
    put:
      summary: Actualizar una regla de alerta
      description: Solo el Administrador Técnico puede modificar parámetros o activar/desactivar reglas.
      tags: [Alertas]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarReglaAlertaRequest'
      responses:
        '200':
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReglaAlertaDto'
        '400':
          description: JSON inválido o parámetros incompletos para el tipo de regla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es Administrador Técnico
        '404':
          description: Regla no encontrada

  /api/analisis/curso/{cursoId}:
    get:
      summary: Análisis grupal del curso
      description: >-
        Detecta actividades con resultados bajos, tendencias entre actividades y
        hallazgos descriptivos del grupo (HU-11).
      tags: [Análisis]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Análisis grupal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisGrupalDto'
        '403':
          description: Curso ajeno al docente autenticado
        '404':
          description: Curso no encontrado


  # --- HU-02: cuentas de docentes (solo Administrador Técnico) ---
  /api/usuarios/docentes:
    get:
      summary: Listar cuentas de docentes
      tags: [Usuarios]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filtro por nombre o correo.
      responses:
        '200':
          description: Docentes con su estado y cursos asignados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocenteDto'
        '403':
          description: El usuario no es Administrador Técnico
    post:
      summary: Crear la cuenta de un docente
      description: Usa el mismo correo que el docente tiene en Moodle para que la sincronización le asigne sus cursos.
      tags: [Usuarios]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearDocenteRequest'
      responses:
        '201':
          description: Docente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocenteDto'
        '400':
          description: Datos inválidos o clave temporal débil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es Administrador Técnico
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios/docentes/{id}:
    put:
      summary: Editar nombre y correo de un docente
      tags: [Usuarios]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocenteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarDocenteRequest'
      responses:
        '200':
          description: Docente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocenteDto'
        '403':
          description: El usuario no es Administrador Técnico
        '404':
          description: Docente no encontrado
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios/docentes/{id}/estado:
    put:
      summary: Activar o desactivar la cuenta de un docente
      description: Un docente desactivado no puede iniciar sesión. Las cuentas no se eliminan para conservar sus cursos e historial.
      tags: [Usuarios]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocenteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoDocenteRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocenteDto'
        '403':
          description: El usuario no es Administrador Técnico
        '404':
          description: Docente no encontrado

  /api/usuarios/docentes/{id}/desbloquear:
    post:
      summary: Quitar el bloqueo por intentos fallidos
      tags: [Usuarios]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocenteIdPath'
      responses:
        '200':
          description: Cuenta desbloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocenteDto'
        '403':
          description: El usuario no es Administrador Técnico
        '404':
          description: Docente no encontrado

  /api/usuarios/docentes/{id}/restablecer-clave:
    post:
      summary: Asignar una nueva clave temporal
      description: La clave anterior deja de funcionar y la cuenta se desbloquea.
      tags: [Usuarios]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocenteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerClaveRequest'
      responses:
        '200':
          description: Clave restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocenteDto'
        '400':
          description: Clave temporal débil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es Administrador Técnico
        '404':
          description: Docente no encontrado

  # --- RF-03: sincronización con Moodle (automática cada N minutos y manual) ---
  /api/sincronizacion/moodle:
    post:
      summary: Sincronizar ahora con Moodle
      description: >-
        Importa cursos, matrículas, actividades y notas desde Moodle (vía MoodleService) y registra la
        ejecución. El backend también la ejecuta automáticamente cada MOODLE_SYNC_MINUTOS minutos.
      tags: [Sincronización]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SincronizarMoodleRequest'
      responses:
        '200':
          description: Registro de la sincronización (fecha, contadores y errores)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SincronizacionMoodleDto'
        '403':
          description: El usuario no es Administrador Técnico
        '409':
          description: Ya hay una sincronización en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sincronizacion/moodle/historial:
    get:
      summary: Historial de sincronizaciones
      tags: [Sincronización]
      security:
        - BearerAuth: []
      parameters:
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Sincronizaciones de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SincronizacionMoodleDto'
        '403':
          description: El usuario no es Administrador Técnico

  /api/sincronizacion/moodle/estado:
    get:
      summary: Fecha y estado de la última sincronización
      description: Visible para docentes y administrador (RNF-08, fuente y fecha de los datos).
      tags: [Sincronización]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado de la sincronización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoSincronizacionDto'

  # --- Fotos de perfil sincronizadas desde Moodle (solo el docente propietario) ---
  /api/cursos/{cursoId}/fotos:
    get:
      summary: Estudiantes del curso que tienen foto de perfil en Moodle
      tags: [Estudiantes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Ids de los estudiantes con foto
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '403':
          description: Curso ajeno al docente autenticado o usuario administrador
        '404':
          description: Curso no encontrado

  /api/cursos/{cursoId}/estudiantes/{estudianteId}/foto:
    get:
      summary: Foto de perfil de un estudiante del curso
      description: >-
        La imagen se obtiene de Moodle a través de MoodleService con el token técnico y se guarda una hora en memoria.
        Responde con Cache-Control private. Solo para el docente propietario del curso (dato personal, RN-11).
      tags: [Estudiantes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoId'
        - name: estudianteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Imagen de la foto de perfil
          content:
            image/*:
              schema:
                type: string
                format: binary
        '403':
          description: Curso ajeno al docente autenticado o usuario administrador
        '404':
          description: El estudiante no está en el curso o no tiene foto
